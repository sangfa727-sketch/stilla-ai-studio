[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stilla-ai-studio"
version = "0.1.0"
description = "Local-first AI video planning and production studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]
desktop = ["pywebview>=5.4,<6.0"]

[tool.setuptools.packages.find]
include = ["stilla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
