name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest
      - name: Check formatting and lint
        run: ruff check .
      - name: Check prototype JavaScript syntax
        run: |
          node --check apps/desktop-prototype/i18n.js
          node --check apps/desktop-prototype/characters.js
