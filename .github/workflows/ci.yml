name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-project-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,image]'
      - name: Verify Windows file locking and local persistence
        run: python -m pytest tests/test_media_workspace.py tests/test_character_revisions.py tests/test_desktop_workspace_api.py tests/test_character_reference_transactions.py tests/test_character_reference_preview.py tests/test_image_validation.py tests/test_local_runtime.py tests/test_local_runtime_api.py

  windows-desktop-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install desktop and packaging dependencies
        run: python -m pip install -e '.[desktop,dev,image,packaging]'
      - name: Build one-folder Windows desktop application
        run: python -m PyInstaller --noconfirm packaging/stilla.spec
      - name: Verify packaged executable and exact runtime UI path
        shell: pwsh
        run: |
          $exe = "dist/STILLA-AI-Studio/STILLA-AI-Studio.exe"
          $internal = "dist/STILLA-AI-Studio/_internal"
          $html = "$internal/apps/desktop-prototype/index.html"
          if (-not (Test-Path $exe)) {
            throw "Packaged executable missing: $exe"
          }
          if (-not (Test-Path $html)) {
            throw "Expected runtime UI path missing: $html"
          }
          python -c "import sys; from pathlib import Path; sys._MEIPASS = str(Path(r'$internal').resolve()); from stilla.desktop.app import prototype_entrypoint; p = prototype_entrypoint(); assert p == Path(r'$html').resolve(), f'Unexpected resolved UI path: {p}'; print(f'Runtime UI path OK: {p}')"
      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: stilla-windows-desktop
          path: dist/STILLA-AI-Studio/
          if-no-files-found: error
          retention-days: 7

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e '.[dev,image]'
      - name: Run tests
        run: python -m pytest
      - name: Check formatting and lint
        run: ruff check .
      - name: Check prototype JavaScript syntax
        run: |
          node --check apps/desktop-prototype/i18n.js
          node --check apps/desktop-prototype/characters.js
          node --check apps/desktop-prototype/storyboard.js
          node --check apps/desktop-prototype/desktop-bridge.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("apps/desktop-prototype/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline application script, found {len(scripts)}")
          Path("/tmp/stilla-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/stilla-inline.js
          node --test tests/js/*.test.js
